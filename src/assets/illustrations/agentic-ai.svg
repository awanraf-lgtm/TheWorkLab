<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
<title>Animated abstract representation of automation, warm palette</title>
<desc>A rotating ring of tooth-like forms at the center, three rings of nodes orbiting at different speeds and directions around it, gradient flow lines with moving dashes suggesting travel, and two corner grids of small squares pulsing in a wave toward the center, all in a warm terracotta and coral palette.</desc>
<defs>
<linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#D97757"/>
<stop offset="50%" stop-color="#E8927C"/>
<stop offset="100%" stop-color="#F0B594"/>
</linearGradient>
</defs>
  <style>
    /* Everything turns about the centre of the rings. */
    #teeth, #orbit80, #orbit130, #orbit170 {
      transform-box: view-box;
      transform-origin: 340px 250px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Central ring of teeth rotates slowly. */
    #teeth { animation: spin 40s linear infinite; }

    /* Three node rings orbit at different speeds and directions. */
    #orbit80 { animation: spin 16s linear infinite; }
    #orbit130 { animation: spin 24s linear infinite reverse; }
    #orbit170 { animation: spin 32s linear infinite; }

    /* Flow lines: moving dashes suggest travel. */
    .flow--a { stroke-dasharray: 14 10; animation: flow-a 1.2s linear infinite; }
    .flow--b { stroke-dasharray: 10 8; animation: flow-b 1s linear infinite; }
    @keyframes flow-a { to { stroke-dashoffset: -24; } }
    @keyframes flow-b { to { stroke-dashoffset: -18; } }

    /* Corner grids pulse in a wave toward the centre. */
    .cell {
      opacity: 0.35;
      animation: cell 1.8s ease-in-out infinite;
    }
    @keyframes cell {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
