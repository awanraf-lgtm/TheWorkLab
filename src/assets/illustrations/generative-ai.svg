<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
<title>Animated abstract representation of generative AI, warm palette</title>
<desc>A field of scattered dots on the left drifts and jitters like noise, faint lines in the middle zone repeatedly draw themselves in and fade as loose clusters form, an ordered lattice of connected nodes on the right pulses in a wave sweeping left to right, and two gradient threads with moving dashes flow from the chaotic field into the ordered grid, all in a warm terracotta and coral palette.</desc>
<defs>
<linearGradient id="genflow" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#D97757"/>
<stop offset="50%" stop-color="#F0B594"/>
<stop offset="100%" stop-color="#C86A4A"/>
</linearGradient>
</defs>
  <style>
    /* Scattered field: dots drift and jitter like noise. */
    .dot {
      transform-box: fill-box;
      transform-origin: center;
      animation: drift 3.2s ease-in-out infinite;
    }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(2px, -3px); }
      50% { transform: translate(-2px, 2px); }
      75% { transform: translate(3px, 1px); }
    }

    /* Middle zone: faint links draw themselves in, hold, then fade. */
    .link {
      stroke-dasharray: 60;
      animation: draw 3s ease-in-out infinite both;
    }
    @keyframes draw {
      0% { stroke-dashoffset: 60; opacity: 0; }
      35% { stroke-dashoffset: 0; opacity: 0.6; }
      70% { stroke-dashoffset: 0; opacity: 0.6; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    /* Ordered lattice: node halos pulse in a wave, left to right by column. */
    .halo {
      opacity: 0.15;
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.12; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.35); }
    }

    /* Threads: dashes travel from the chaotic field into the grid. */
    .thread--a { stroke-dasharray: 14 10; animation: flow-a 1.2s linear infinite; }
    .thread--b { stroke-dasharray: 10 8; animation: flow-b 1s linear infinite; }
    @keyframes flow-a { to { stroke-dashoffset: -24; } }
    @keyframes flow-b { to { stroke-dashoffset: -18; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
